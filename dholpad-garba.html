<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>શ્રી દયારામભાઇ દ્વારા રચિત ધોળ-પદ, ગરબા</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rasa:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --red-deep:#7A1220;
    --red:#C1272D;
    --orange:#EE7422;
    --yellow:#F5B133;
    --cream:#FFF8EA;
    --ivory:#FFFDF8;
    --ink:#4A2210;
    --ink-soft:#7A4A30;
    --ring:0 0 0 3px rgba(238,116,34,.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Rasa', 'Noto Sans Gujarati', serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  header{
    position:relative;
    background:linear-gradient(160deg, var(--red-deep) 0%, var(--red) 38%, var(--orange) 72%, var(--yellow) 100%);
    padding:0 0 34px;
    overflow:hidden;
    text-align:center;
  }
  .toran{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:34px;
    padding-top:6px;
    position:relative;
  }
  .toran::before{
    content:"";
    position:absolute;
    top:14px;left:4%;right:4%;
    height:2px;
    background:rgba(255,251,240,.55);
  }
  .flag{
    width:15px;height:19px;
    clip-path:polygon(0 0,100% 0,50% 100%);
    box-shadow:0 1px 2px rgba(0,0,0,.18);
    flex:0 0 auto;
    margin:0 1px;
  }
  .crest{
    margin-top:22px;
    font-size:2rem;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
  }
  header h1{
    font-family:'Rasa',serif;
    font-weight:700;
    font-size:clamp(2.1rem,7vw,3.1rem);
    color:var(--ivory);
    margin:10px 0 4px;
    letter-spacing:.02em;
    text-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .divider{
    width:120px;height:3px;
    margin:16px auto 0;
    background:repeating-linear-gradient(90deg,#FFF 0 8px, transparent 8px 16px);
    opacity:.7;
    border-radius:3px;
  }

  main{max-width:720px;margin:0 auto;padding:20px 14px 60px;}
  .panel{display:none;}
  .panel.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .hint{
    text-align:center;color:var(--ink-soft);
    font-size:.9rem;margin:2px 0 18px;
    font-family:'Cormorant Garamond',serif;font-style:italic;
  }

  .song-card{
    background:var(--ivory);
    border-radius:16px;
    margin-bottom:14px;
    box-shadow:0 3px 12px rgba(122,18,32,.08);
    border-left:5px solid var(--orange);
    overflow:hidden;
  }
  .song-head{
    width:100%;
    display:flex;align-items:center;gap:14px;
    background:none;border:none;cursor:pointer;
    padding:16px 16px;
    text-align:right;
    font-family:inherit;color:inherit;
  }
  .song-head:focus-visible{outline:none;box-shadow:var(--ring);border-radius:12px;}
  .song-num{
    flex:0 0 auto;
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(140deg,var(--yellow),var(--orange));
    color:#fff;font-weight:700;font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(238,116,34,.4);
  }
  .song-titles{flex:1;text-align:right;}
  .song-title{
    display:block;font-weight:700;font-size:1.18rem;color:var(--red-deep);
    line-height:1.35;
  }
  .song-tek{
    display:block;margin-top:3px;font-size:.94rem;color:var(--ink-soft);
    font-style:italic;
  }
  .chev{
    flex:0 0 auto;
    width:26px;height:26px;
    color:var(--orange);
    transition:transform .35s ease;
    font-size:1.3rem;
    display:flex;align-items:center;justify-content:center;
  }
  .song-card.open .chev{transform:rotate(180deg);}

  .song-body-wrap{max-height:0;overflow:hidden;transition:max-height .4s ease;}
  .song-body{padding:2px 20px 22px 20px;}
  .tek-line{
    background:linear-gradient(90deg, rgba(238,116,34,.12), rgba(245,177,51,.10));
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:14px;
    color:var(--red-deep);
    font-weight:600;font-size:1.05rem;
    line-height:1.6;
  }
  .verse{
    margin-bottom:14px;
  }
  .verse .vlabel{
    font-weight:700;color:var(--orange);font-size:.92rem;
    margin-right:6px;
  }
  .verse .vtext{
    font-size:1.12rem;line-height:1.85;color:var(--ink);
  }
  .verse .vtek{
    display:block;
    margin-top:2px;
    font-size:.95rem;
    font-style:italic;
    color:var(--ink-soft);
  }
  .song-author{
    margin-top:6px;
    text-align:left;
    font-size:.92rem;
    font-style:italic;
    color:var(--ink-soft);
  }
  .section-divider{
    display:flex;align-items:center;gap:10px;
    margin:26px 4px 14px;
    text-align:center;
    color:var(--red-deep);
    font-weight:700;font-size:1.02rem;
  }
  .section-divider::before,.section-divider::after{
    content:"";flex:1;height:2px;
    background:linear-gradient(90deg, transparent, var(--orange), transparent);
  }

  footer{
    text-align:center;padding:26px 14px 40px;
    color:var(--ink-soft);font-size:.85rem;
  }
  footer .toran{transform:scale(.75);opacity:.8;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="toran" id="toranTop"></div>
  <div class="crest">🪔</div>
  <h1>શ્રી દયારામભાઇ દ્વારા રચિત ધોળ-પદ, ગરબા</h1>
  <div class="divider"></div>
</header>

<main>
  <section class="panel active" id="panelSongs">
    <p class="hint">ગીત પર ટેપ કરીને આખું પદ વાંચો / ગાઓ</p>
    <div id="songList"></div>
  </section>
</main>

<footer>
  <div class="toran" id="toranBottom"></div>
</footer>

<script>
const SONGS = [
  {
    num:"૧",
    title:"શોભા સલૂણા શ્યામની",
    tek:"તૂં જોને સખી, શોભા સલૂણા શ્યામની!",
    verses:[
      "કોટી કંદર્પ લજાવે એહેનું મૂખડું, ફીકી પડે છે કળા જામિની...",
      "સદ્ગુણસાગર નટવરનાગર, બલીહારી એહેના નામની...",
      "કોટી આભૂષણનું એરે ભૂષણ, સીમાં છે અભિરામની...",
      "જે એને જાણે તેને તો એ સાર સર્વનો, બીજી વસ્તુ નથી કામની...",
      "અનૂપમ એ અલબેલા રસીયા, જીવનમૂળી દયારામની..."
    ]
  },
  {
    num:"૨",
    title:"જળ જાતાં આજ ઘુંઘટડામાં",
    tek:"જળ જાતાં આજ ઘુંઘટડામાં, મોહનનું મુખ દીઠુંરે, અમૃતરસ પણ એથકી ફીકા બાઈ, એહેવું લાગ્યું છે મુને મીઠુંરે...",
    verses:[
      "એહેને પણ કાંઈ નથી રે અજાણ્યું, મુને સાન કરી સમજાવીરે, ચાંપી હૃદે કરી હેત જણાવ્યું મુને, સાહામા તે નેન નચાવીરે...",
      "શું કહું સુખ દુખ તેજ સમાનું, શર સ્નેહતણાં ઉર વાગ્યાંરે, મનમાં આવે તેમ મુખે ક્યમ કહેવું, પેલા દુરિજન દૈત્યસા લાગ્યાંરે...",
      "રસિયો રૂપાળો ચતુર કો એવા નથી, અવર મેં નિશ્ચે ભાળ્યુંરે, ધન ભાગ્ય જેણે દયાના પ્રીતમ સંગ, મનગમતું સુખ માહાલ્યુંરે..."
    ]
  },
  {
    num:"૩",
    title:"તાદ્રશી જન તેને જાણીયે",
    tek:"તાદશી જન તેને જાણીયે, જેમાં એવા ગુણ હોય, જેમાં એવા ગુણ હોય... તાદશી!",
    verses:[
      "નિંદા સ્તુતિ કોઈની નવ કરે, સઘળે સમદ્રષ્ટિ જોય... (તાદશી!) દર્શન કરતા માત્રમાં, ભુલાવે પ્રપંચનું ભાન, સ્મરણ કરાવે શ્રી કૃષ્ણનું નસાડે અધ અજ્ઞાન... (તાદશી!)",
      "સર્વ ચરાચરને વિષે, વસ્યા દેખે ભગવાન, શુભ ઈચ્છે સર્વ જગતનું, લેશ નહિં અભિમાન... (તાદશી!)",
      "ગુણગાતા ગોવિંદના પુલકિત તન થાય, નેત્રે પ્રવાહ વહે પ્રેમના, હરખે હ્રદય રૂંધાય... (તાદશી!)",
      "પર દુઃખે દાઝે ઘણું, કરે ન કોઈનો દ્રોહ, ઈન્દ્રિય જીત સાચા સદા, પામે નહિ માયામાં મોહ... (તાદશી!)",
      "અકળ લીલા નંદલાલની, તેમાં લગ્ન જેનું મન, પ્રીત બહુ પર ઉપકારમાં, સદા પ્રસન્ન વદન... (તાદશી!)",
      "નટવર ઝળકે નેત્રમાં, કાંતિ કરુણામય હોય, શાંત સ્વભાવ સંતોષ બહુ, દોષ કોઈના ન જોય... (તાદશી!)",
      "વ્હાલા લાગે સહેજે સર્વને, અતિ ઉદાર જેનું ચિત્ત, અનન્ય ભાવે ભજે કૃષ્ણને, જેને વહાલું નહિ વિત્ત... (તાદશી!)",
      "હરિ ગુરુ વૈષ્ણવને વિષે, જેને સદા અતિ વહાલ, દૃઢ વિશ્વાસ અતિ દીનતા, બોલે વચન રસાલ... (તાદશી!)",
      "સેવા સ્મરણ સત્સંગમાં, જેની આશકિત અત્ય, કપટનો લેશ નહિ હ્રદયે, હરિ ચરણે સદા મત્ય... (તાદશી!)",
      "વ્યસનાવસ્થા વિઠ્ઠલેશસૂં, સદા મુખે કૃષ્ણ નામ, તે ભગવદીય તણા દાસનો, સદા દાસ 'દયારામ'... (તાદશી!)"
    ]
  },
  {
    num:"૪",
    title:"રાધે તું પ્યારીને બીજું અવર ન કોઈ",
    tek:"રાધે તું પ્યારીને બીજું અવર ન કોઈ...",
    verses:[
      "જેને જગત મોહ્યું તે તો તુંને રહ્યો મોહી...",
      "ગોકુળની ગોરી સહૂ એની પુઠે ભમે છે, તેરે વ્હાલાને ત્હારી ગાળો ગમે છે...",
      "વ્રજવામા સહુને એ નાક ઘસાવે, તેરે વ્હાલો તાહારે ઘેર વણુતેડ્યો આવે...",
      "હું પણ જાણું એહેનું મળવું ક્યાંથી, ક્ષણું એક અળગો ન થાય તારે ત્યાંહાંથી...",
      "તેં વશ કીધો રાધે દયાનો પ્રભૂજી, હું નવ જાણું તેં તે કઈ ગોર પૂજી..."
    ]
  },
  {
    num:"૫",
    title:"વ્રજ વહાલું રે, વૈકુંઠ નહીં આવું",
    tek:"વ્રજ વહાલું રે, વ્રજ વહાલું રે વૈકુંઠ નહીં આવું, ત્યાં મારો નંદકુંવર ક્યાંથી લાવું...",
    verses:[
      "ત્યાં લલિત ત્રિભંગી નથી ગિરિધારી, સંગે સોહિયે રાધા પ્યારી, એમને નીરખતાં આંખ ઠરે મારી રે...",
      "ત્યાં જમુના શ્રી ગિરિવર છે જ નહીં રે, મારું મન જ સત્ય ઠરે જ નહીં રે, મારા પ્રાણ પ્રસન્ન ત્યાં રહે જ નહીં રે...",
      "ત્યાં શ્રી વૃન્દાવન રાસ નથી, વ્રજ વનિતાની સંગે વિલાસ નથી, ત્યાં આ લીલાનો પ્રકાશ નથી રે...",
      "ત્યાં ગોપીઓ તણા ઘી-દૂધ નથી, કોઈ માખણ ચોરનાર ધૂત નથી, ત્યાં આવા ગોકુળિયાના સુખ નથી રે...",
      "ત્યાં દાસ દયાના પ્રીતમ નથી, આવા શ્યામ સુંદર કોઈ ઉત્તમ નથી, હું તો વ્રજની રજમાં રાચી રહું રે..."
    ]
  },
  {
    num:"૬",
    title:"માધવપુરનો માંડવો",
    tek:"માધવપુરનો માંડવો, આવે જાદવકુળની જાન...",
    verses:[
      "પરણે સુંદર વર શામળો, જેનાં વેદ પુરાણ કરે ગાન...",
      "મોરપીંછનો મુગટ શિરે, કાને કુંડળ ઝળકે સાર, કંઠે વિરાજિત વનમાળા, હૈડે રત્ન તણો હાર...",
      "પીતાંબર કટિ કસીયું, હાથે સોહે સુવર્ણ કંકણ, ચરણે નૂપુર રૂમઝૂમ વાજે, મોહિત કીધાં મુનિમન...",
      "ચોરી ચિતરાવી વિધ વિધની, બેઠા મંડપમાં જગદીશ, મુક્તાનંદના નાથને રે, સૌ નમી નમી નામે શીશ..."
    ]
  },
];

const GUJ_DIGITS = ['૦','૧','૨','૩','૪','૫','૬','૭','૮','૯'];
function toGujNum(n){ return String(n).split('').map(d => GUJ_DIGITS[+d]).join(''); }

const songList = document.getElementById('songList');
SONGS.forEach((song) => {

  if (song.divider) {
    const div = document.createElement('div');
    div.className = 'section-divider';
    div.innerHTML = `<span>🪔 ${song.divider} 🪔</span>`;
    songList.appendChild(div);
    return;
  }

  const card = document.createElement('div');
  card.className = 'song-card';

  const head = document.createElement('button');
  head.className = 'song-head';
  head.setAttribute('aria-expanded','false');
  head.innerHTML = `
    <span class="song-num">${song.num}</span>
    <span class="song-titles">
      <span class="song-title">${song.title}</span>
      <span class="song-tek">${song.tek}</span>
    </span>
    <span class="chev">▾</span>
  `;

  const bodyWrap = document.createElement('div');
  bodyWrap.className = 'song-body-wrap';
  const body = document.createElement('div');
  body.className = 'song-body';

  const tekLine = document.createElement('div');
  tekLine.className = 'tek-line';
  tekLine.textContent = '🎵 ' + song.tek;
  body.appendChild(tekLine);

  song.verses.forEach((v, vi) => {
    const verse = document.createElement('div');
    verse.className = 'verse';
    verse.innerHTML = `<span class="vlabel">કડી ${toGujNum(vi + 1)}:</span><span class="vtext">${v}</span><span class="vtek">→ ટેક: ${song.tek}</span>`;
    body.appendChild(verse);
  });

  if (song.author) {
    const authorLine = document.createElement('div');
    authorLine.className = 'song-author';
    authorLine.textContent = '— ' + song.author;
    body.appendChild(authorLine);
  }

  bodyWrap.appendChild(body);
  card.appendChild(head);
  card.appendChild(bodyWrap);
  songList.appendChild(card);

  head.addEventListener('click', () => {
    const isOpen = card.classList.toggle('open');
    head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    bodyWrap.style.maxHeight = isOpen ? body.scrollHeight + 'px' : '0px';
  });
});

window.addEventListener('resize', () => {
  document.querySelectorAll('.song-card.open').forEach(card => {
    const wrap = card.querySelector('.song-body-wrap');
    const body = card.querySelector('.song-body');
    wrap.style.maxHeight = body.scrollHeight + 'px';
  });
});

function buildToran(container){
  container.innerHTML = '';
  const colors = ['var(--red)','var(--orange)','var(--yellow)','#FFFDF8'];
  const width = container.clientWidth || 320;
  const count = Math.max(9, Math.min(30, Math.floor(width / 20)));
  const mid = (count - 1) / 2;
  for(let i=0;i<count;i++){
    const flag = document.createElement('div');
    flag.className = 'flag';
    flag.style.background = colors[i % colors.length];
    const sag = Math.pow((i - mid) / (mid || 1), 2);
    flag.style.marginTop = (14 - sag*12) + 'px';
    container.appendChild(flag);
  }
}
buildToran(document.getElementById('toranTop'));
buildToran(document.getElementById('toranBottom'));
window.addEventListener('resize', () => {
  buildToran(document.getElementById('toranTop'));
  buildToran(document.getElementById('toranBottom'));
});
</script>
</body>
</html>
