<style>
:root{
  --ground:#FAF5EA; --raised:#FFFFFF; --sunk:#F4EDDE;
  --ink:#231E2C; --ink-soft:#5B5366; --ink-faint:#8A8195;
  --rule:#E2D7C3; --gold:#96660F; --rose:#AF3A34; --teal:#1C6A63;
  --shadow:0 1px 2px rgba(35,30,44,.05),0 6px 18px rgba(35,30,44,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#12101E; --raised:#1C1929; --sunk:#181524;
  --ink:#F0EADD; --ink-soft:#AEA5BA; --ink-faint:#7E7589;
  --rule:#2F2A43; --gold:#DCA83F; --rose:#DE5B54; --teal:#52ADA4;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 26px rgba(0,0,0,.32);
}}
:root[data-theme="dark"]{
  --ground:#12101E; --raised:#1C1929; --sunk:#181524;
  --ink:#F0EADD; --ink-soft:#AEA5BA; --ink-faint:#7E7589;
  --rule:#2F2A43; --gold:#DCA83F; --rose:#DE5B54; --teal:#52ADA4;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 26px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Noto Serif Gujarati",Georgia,serif;
  line-height:1.6; margin:0; padding:0 16px 80px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:780px;margin:0 auto}

header{padding:40px 0 4px;text-align:center}
.lamp{font-size:1.7rem;line-height:1;margin-bottom:12px}
h1{
  font-family:"Noto Serif Gujarati",serif;font-weight:700;
  font-size:clamp(1.5rem,4.8vw,2.2rem);line-height:1.35;
  margin:0 0 8px;text-wrap:balance;
}
/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:26px 0 0}
.tab{
  font-family:"Noto Serif Gujarati",serif;font-size:1.05rem;font-weight:600;
  background:var(--sunk);color:var(--ink-faint);
  border:1px solid var(--rule);border-radius:4px;
  padding:14px 8px;cursor:pointer;line-height:1.35;
  transition:background .15s,color .15s,border-color .15s;
}
.tab .cnt{
  display:block;font-family:Fraunces,serif;font-size:.68rem;
  font-weight:600;letter-spacing:.06em;margin-top:4px;opacity:.85;
}
.tab[aria-selected="true"]{
  background:var(--accent-bg);color:#fff;border-color:transparent;
}
#tab-d[aria-selected="true"]{--accent-bg:var(--gold)}
#tab-l[aria-selected="true"]{--accent-bg:var(--rose)}
.tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.hint{
  text-align:center;color:var(--ink-faint);font-size:.88rem;
  margin:20px 0 22px;
}

.panel[hidden]{display:none!important}
#panel-d{--accent:var(--gold)}
#panel-l{--accent:var(--rose)}

/* song */
.song{
  background:var(--raised);border:1px solid var(--rule);
  border-radius:4px;margin:0 0 10px;box-shadow:var(--shadow);
  overflow:hidden;
}
.song-btn{
  width:100%;display:grid;grid-template-columns:auto 1fr auto;
  gap:0 14px;align-items:center;text-align:left;
  background:transparent;border:0;padding:15px 16px;cursor:pointer;
  font-family:inherit;color:inherit;
}
.num{
  font-family:"Noto Serif Gujarati",serif;font-size:1rem;font-weight:600;
  color:var(--accent);min-width:1.6em;
}
.nm{min-width:0}
.nm-gu{
  font-size:1.16rem;font-weight:600;line-height:1.45;
  margin:0;color:var(--ink);
}
.nm-en{
  font-family:Fraunces,Georgia,serif;font-size:.76rem;
  color:var(--ink-faint);margin:2px 0 0;letter-spacing:.01em;
}
.tags{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tag{
  font-family:Fraunces,serif;font-size:.65rem;font-weight:600;
  letter-spacing:.06em;padding:2px 6px;border-radius:3px;
  border:1px solid var(--accent);color:var(--accent);white-space:nowrap;
}
.dur{font-family:Fraunces,serif;font-size:.74rem;color:var(--ink-faint)}
.chev{color:var(--ink-faint);transition:transform .18s;font-size:1.1rem}
.song-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}

.body{border-top:1px solid var(--rule);background:var(--sunk);padding:20px 18px 22px}
.body[hidden]{display:none!important}

.ly-sec{margin:0 0 17px}
.ly-sec:last-of-type{margin-bottom:0}
.ly-lab{
  font-family:Fraunces,serif;font-size:.66rem;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 6px;
}
.ly-l{
  font-size:1.2rem;line-height:2.05;margin:0;
  color:var(--ink);text-wrap:pretty;
}
.ly-ref{
  color:var(--ink-soft);padding-left:14px;
  border-left:3px solid var(--accent);
}
.no-text{
  color:var(--ink-faint);font-size:.95rem;margin:0;
}
.listen{
  display:inline-block;margin-top:16px;
  font-family:Fraunces,serif;font-size:.78rem;font-weight:600;
  color:var(--teal);text-decoration:none;
  border:1px solid var(--teal);border-radius:3px;padding:7px 13px;
}
.listen:hover{background:var(--teal);color:var(--ground)}

.tools{display:flex;justify-content:center;gap:9px;margin:24px 0 0;flex-wrap:wrap}
.tools button{
  font-family:Fraunces,serif;font-size:.74rem;font-weight:600;
  background:transparent;color:var(--ink-soft);
  border:1px solid var(--rule);border-radius:3px;
  padding:8px 13px;cursor:pointer;
}
.tools button:hover{border-color:var(--teal);color:var(--teal)}

footer{
  margin-top:40px;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--ink-faint);font-size:.84rem;text-align:center;line-height:1.75;
}

@media (max-width:520px){
  .nm-gu{font-size:1.06rem}
  .ly-l{font-size:1.13rem;line-height:1.95}
  .dur{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.ponly{display:none}

@media print{
  .ponly{
    display:block;font-family:"Noto Serif Gujarati",serif;
    font-size:15pt;font-weight:700;color:#000;
    margin:0 0 10pt;padding-bottom:5pt;border-bottom:1.5pt solid #555;
    break-after:avoid;
  }
  #panel-l .ponly{break-before:page}
  body{background:#fff;color:#000;padding:0}
  .tabs,.tools,.chev,.listen,.hint{display:none!important}
  .panel[hidden]{display:block!important}
  .body[hidden]{display:block!important}
  .song{break-inside:avoid;box-shadow:none;border-color:#ccc;margin-bottom:6px}
  .body{background:#fff}
  .ly-l{font-size:11pt;line-height:1.6;color:#000}
  .ly-ref{color:#333;border-left-color:#999}
  .tag{display:none}
}
</style>

const GU = "૦૧૨૩૪૫૬૭૮૯";
const gu = n => String(n).split("").map(c => GU[+c]).join("");
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function songHTML(s){
  const ly = DATA.ly[s.id];
  const has = !!ly;
  const real = !s.id.startsWith("_");
  return `<div class="song">
    <button class="song-btn" aria-expanded="false" aria-controls="b_${s.id}">
      <span class="num">${gu(s.n)}.</span>
      <span class="nm">
        <span class="nm-gu">${esc(s.gu)}</span>
        <span class="nm-en">${esc(s.t)}</span>
      </span>
      <span class="tags">
        ${has ? `<span class="tag">લખાણ</span>` : ""}
        ${s.dur ? `<span class="dur">${s.dur}</span>` : ""}
        <span class="chev">›</span>
      </span>
    </button>
    <div class="body" id="b_${s.id}" hidden>
      ${has
        ? ly.sec.map(sec => `<div class="ly-sec">
            <p class="ly-lab">${esc(sec.l)}</p>
            ${sec.lines.map(L => `<p class="ly-l${L.r ? " ly-ref" : ""}">${esc(L.t)}</p>`).join("")}
          </div>`).join("")
        : `<p class="no-text">આ ગીતનું લખાણ હજી ઉમેરવાનું બાકી છે. રેકોર્ડિંગ સાંભળીને શીખી શકાય.</p>`}
      ${real ? `<a class="listen" href="https://www.youtube.com/watch?v=${s.id}" target="_blank" rel="noopener noreferrer">▶ સાંભળો</a>` : ""}
    </div>
  </div>`;
}

function fill(el, list, heading){
  el.innerHTML = `<h2 class="ponly">${heading}</h2>` + list.map(songHTML).join("");
  el.querySelectorAll(".song-btn").forEach(b => b.addEventListener("click", () => {
    const open = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", String(!open));
    document.getElementById(b.getAttribute("aria-controls")).hidden = open;
  }));
}
fill(document.getElementById("panel-d"), DATA.dhol, "ધોળ-પદ");
fill(document.getElementById("panel-l"), DATA.lagna, "લગ્નગીત");

document.querySelectorAll(".tab .cnt").forEach((c,i) => {
  const L = i === 0 ? DATA.dhol : DATA.lagna;
  c.textContent = `${gu(L.length)} ગીત`;
});

const T = [["tab-d","panel-d"],["tab-l","panel-l"]];
T.forEach(([t]) => document.getElementById(t).addEventListener("click", () => {
  T.forEach(([tt,pp]) => {
    const on = tt === t;
    document.getElementById(tt).setAttribute("aria-selected", String(on));
    document.getElementById(pp).hidden = !on;
  });
  window.scrollTo({top:0,behavior:"smooth"});
}));

const setAll = open => document.querySelectorAll(".song-btn").forEach(b => {
  b.setAttribute("aria-expanded", String(open));
  document.getElementById(b.getAttribute("aria-controls")).hidden = !open;
});
document.getElementById("openAll").addEventListener("click", () => setAll(true));
document.getElementById("shutAll").addEventListener("click", () => setAll(false));
document.getElementById("prt").addEventListener("click", () => window.print());
