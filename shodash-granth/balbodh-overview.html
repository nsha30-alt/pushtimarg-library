<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>बालबोध: — श्लोक-प्रवाह</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700;900&family=Noto+Sans+Devanagari:wght@300;400;500;600&display=swap">
<style>
/* ─── PALETTE: श्रीवल्लभाचार्य विद्यापीठ ─────────────────────────────────
   dark-red → red → orange gradient · gold/yellow headings · white body
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --dark-red:   #6e0000;
  --red:        #b50000;
  --mid-red:    #c0141a;
  --orange:     #e06010;
  --gold:       #d4a017;
  --yellow:     #f5c518;
  --cream:      #fff9f0;
  --white:      #ffffff;
  --text-body:  rgba(255,255,255,0.92);
  --text-soft:  rgba(255,220,140,0.85);
  --card-bg:    rgba(110,0,0,0.55);
  --card-border: rgba(212,160,23,0.55);
  color-scheme: dark;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Sans Devanagari', 'Mangal', sans-serif;
  background: var(--dark-red);
  color: var(--white);
  user-select: none;
}

/* ─── GRADIENT BG ─── */
#bg {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(135deg, var(--dark-red) 0%, var(--red) 45%, var(--orange) 100%);
}

/* ─── PROGRESS ─── */
#progress {
  position: fixed; top: 0; left: 0; z-index: 200;
  height: 3px;
  background: linear-gradient(90deg, var(--yellow), var(--gold));
  transition: width 0.5s ease;
  pointer-events: none;
}

/* ─── MANDALA WATERMARK ─── */
#mandala {
  position: fixed; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0.06;
}
#mandala svg {
  width: min(85vmin, 650px); height: min(85vmin, 650px);
  animation: spin 180s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── DECK ─── */
#deck { position: relative; width: 100%; height: 100%; z-index: 2; }

.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2.5rem 1.5rem 5rem;
  opacity: 0; pointer-events: none;
  transition: opacity 0.55s ease;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.slide.active { opacity: 1; pointer-events: all; }

.slide-inner {
  width: 100%; max-width: 720px;
  display: flex; flex-direction: column;
  align-items: center; gap: 1rem;
  text-align: center;
  padding-block: 0.5rem;
}

/* ─── TYPE ELEMENTS ─── */
.badge {
  display: inline-flex; align-items: center;
  font-size: 0.73rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--yellow);
  border: 1px solid rgba(245,197,24,0.5);
  padding: 0.22rem 1rem;
  border-radius: 100px;
  background: rgba(245,197,24,0.1);
}
.shloka {
  font-family: 'Noto Serif Devanagari', serif;
  font-size: clamp(1.05rem, 2.5vw, 1.38rem);
  font-weight: 700;
  color: var(--yellow);
  line-height: 1.85;
  text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  padding: 1.1rem 1.4rem;
  border-top: 2px solid rgba(245,197,24,0.5);
  border-bottom: 2px solid rgba(245,197,24,0.5);
  border-radius: 4px;
  background: rgba(0,0,0,0.2);
  width: 100%;
  white-space: pre-line;
}
.slide-title {
  font-family: 'Noto Serif Devanagari', serif;
  font-size: clamp(1.45rem, 4.2vw, 2rem);
  font-weight: 700;
  color: var(--yellow);
  line-height: 1.35;
  text-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
.slide-body {
  font-size: clamp(0.9rem, 1.9vw, 1.02rem);
  color: var(--text-body);
  max-width: 58ch;
  line-height: 1.95;
  text-wrap: pretty;
}
.concept {
  font-size: 0.82rem;
  padding: 0.32rem 1.1rem;
  background: rgba(212,160,23,0.18);
  border: 1px solid rgba(212,160,23,0.5);
  border-radius: 100px;
  color: var(--yellow);
  letter-spacing: 0.03em;
}
.rule {
  width: 120px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(245,197,24,0.6), transparent);
}

/* ─── COVER ─── */
.cover-logo {
  width: 90px; height: 90px;
  border-radius: 50%;
  border: 3px solid var(--yellow);
  box-shadow: 0 0 0 6px rgba(245,197,24,0.2), 0 4px 24px rgba(0,0,0,0.5);
  object-fit: cover;
}
.cover-title {
  font-family: 'Noto Serif Devanagari', serif;
  font-size: clamp(2.2rem, 7vw, 3.8rem);
  font-weight: 900;
  color: var(--yellow);
  text-shadow: 0 0 40px rgba(245,197,24,0.5), 2px 2px 6px rgba(0,0,0,0.6);
  line-height: 1.15; letter-spacing: 0.02em;
}
.cover-series {
  font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,220,140,0.8);
}
.cover-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 0.85rem 1.4rem;
  font-size: 0.88rem;
  color: var(--text-body);
  line-height: 1.85;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.cover-start {
  font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(245,197,24,0.6);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: 0.25; } }

/* ─── FINALE ─── */
.finale-list {
  list-style: none;
  display: flex; flex-direction: column; gap: 0.65rem;
  width: 100%; max-width: 580px; text-align: left;
}
.finale-list li {
  display: flex; gap: 0.75rem; align-items: flex-start;
  font-size: 0.94rem; color: var(--text-body); line-height: 1.65;
  background: var(--card-bg);
  border-left: 3px solid var(--gold);
  padding: 0.5rem 0.9rem;
  border-radius: 0 6px 6px 0;
}
.finale-list li::before { content: '॰'; color: var(--yellow); font-size: 1.1rem; flex-shrink: 0; }
.finale-closing {
  font-family: 'Noto Serif Devanagari', serif;
  font-size: clamp(1.05rem, 2.8vw, 1.35rem);
  font-weight: 700;
  color: var(--yellow);
  text-shadow: 0 0 20px rgba(245,197,24,0.4);
}

/* ─── NAV ─── */
#nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center; gap: 1.25rem;
  padding: 0.75rem 1rem;
  padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(110,0,0,0.97) 0%, transparent 100%);
}
.nav-btn {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(245,197,24,0.4);
  color: rgba(245,197,24,0.6);
  width: 2.4rem; height: 2.4rem;
  border-radius: 50%; cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; -webkit-tap-highlight-color: transparent;
}
.nav-btn:hover:not(:disabled) { border-color: var(--yellow); color: var(--yellow); background: rgba(0,0,0,0.5); }
.nav-btn:disabled { opacity: 0.2; cursor: default; }
#counter {
  font-size: 0.74rem; color: rgba(245,197,24,0.6);
  letter-spacing: 0.1em; min-width: 4.5rem; text-align: center;
  font-variant-numeric: tabular-nums;
}

/* ─── DOTS ─── */
#dots {
  position: fixed; right: 1rem; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 6px; z-index: 100;
}
.dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s; }
.dot.on { background: var(--yellow); transform: scale(1.7); }

/* ─── VIDYAPEETH FOOTER STRIP (cover only) ─── */
.vidyapeeth-strip {
  font-size: 0.72rem; letter-spacing: 0.06em;
  color: rgba(255,220,140,0.7);
  border-top: 1px solid rgba(245,197,24,0.25);
  padding-top: 0.5rem; width: 100%;
}

@media (max-width: 480px) {
  .slide { padding: 1.5rem 1rem 5rem; }
  #dots { display: none; }
  .shloka { font-size: 0.97rem; padding: 0.9rem; }
  .slide-title { font-size: 1.4rem; }
  .cover-title { font-size: 2rem; }
}
@media (prefers-reduced-motion: reduce) {
  #mandala svg { animation: none; }
  .cover-start { animation: none; }
  .slide { transition: opacity 0.1s; }
}
</style>
</head>

const deck = document.getElementById('deck');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');
const N = SLIDES.length;
let cur = 0;

function buildSlides() {
  SLIDES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');

    if (s.t === 'cover') {
      el.innerHTML = `
        <div class="slide-inner">
          <img src="${LOGO}" class="cover-logo" alt="श्रीवल्लभाचार्यजी">
          <div class="cover-title">बालबोध:</div>
          <div class="cover-series">षोडशग्रन्थ · श्रीवल्लभाचार्यजी विरचित</div>
          <div class="rule"></div>
          <div class="cover-card">
            वि. सं. १५५०, पुष्करराज में रचित<br>
            नारायणदास कायस्थ के लिए<br>
            १९ श्लोकों में पुष्टिमार्ग का द्वार
          </div>
          <div class="vidyapeeth-strip">॥ श्रीवल्लभाचार्य विद्यापीठ · हालोल, जिला पंचमहाल, गुजरात ॥</div>
          <div class="cover-start">→ आगे बढ़ें</div>
        </div>`;
    } else if (s.t === 'section') {
      el.innerHTML = `
        <div class="slide-inner">
          <div class="badge">${s.tag}</div>
          <div class="slide-title">${s.title}</div>
          <div class="rule"></div>
          <div class="slide-body" style="white-space:pre-line">${s.body}</div>
          <div class="concept">${s.concept}</div>
        </div>`;
    } else if (s.t === 'shloka') {
      el.innerHTML = `
        <div class="slide-inner">
          <div class="badge">${s.num}</div>
          <div class="shloka">${s.shloka}</div>
          <div class="slide-title">${s.title}</div>
          <div class="slide-body">${s.body}</div>
          <div class="concept">${s.concept}</div>
        </div>`;
    } else if (s.t === 'finale') {
      const items = s.items.map(x => `<li>${x}</li>`).join('');
      el.innerHTML = `
        <div class="slide-inner">
          <div class="badge">${s.num}</div>
          <div class="shloka">${s.shloka}</div>
          <div class="slide-title">${s.title}</div>
          <ul class="finale-list">${items}</ul>
          <div class="rule"></div>
          <div class="finale-closing">${s.closing}</div>
        </div>`;
    }

    deck.appendChild(el);
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' on' : '');
    dot.onclick = () => goTo(i);
    dotsEl.appendChild(dot);
  });
}

const allSlides = () => deck.querySelectorAll('.slide');
const allDots = () => dotsEl.querySelectorAll('.dot');

function goTo(n) {
  if (n < 0 || n >= N) return;
  allSlides()[cur].classList.remove('active');
  allDots()[cur].classList.remove('on');
  cur = n;
  allSlides()[cur].classList.add('active');
  allDots()[cur].classList.add('on');
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === N - 1;
  counter.textContent = (cur + 1) + ' / ' + N;
  progress.style.width = ((cur + 1) / N * 100) + '%';
  allSlides()[cur].scrollTop = 0;
}

prevBtn.onclick = () => goTo(cur - 1);
nextBtn.onclick = () => goTo(cur + 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(cur + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(cur - 1);
});
let tx = 0;
deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
deck.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) goTo(cur + (dx < 0 ? 1 : -1));
}, { passive: true });

buildSlides();
goTo(0);
</script>
