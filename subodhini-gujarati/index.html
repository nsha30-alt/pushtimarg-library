<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap');
  :root{--red:#CC0000;--orange:#FF6600;--yellow:#FFD700;--white:#FFFFFF;--cream:#FFF8E7;--dark-red:#8B0000;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Serif Devanagari',serif;background:var(--cream);color:#2C1A00;line-height:1.85;}
  .banner-area{width:100%;min-height:130px;background:linear-gradient(180deg,var(--dark-red) 0%,var(--red) 50%,var(--orange) 100%);display:flex;align-items:center;justify-content:center;border-bottom:6px solid var(--yellow);}
  .banner-placeholder{text-align:center;color:var(--yellow);font-size:1.8em;font-weight:bold;padding:30px;text-shadow:2px 2px 4px rgba(0,0,0,.5);}
  .main-header{background:linear-gradient(135deg,var(--orange),var(--red));color:var(--white);padding:22px 36px;text-align:center;border-bottom:4px solid var(--yellow);}
  .main-header h1{font-size:1.7em;color:var(--yellow);text-shadow:2px 2px 6px rgba(0,0,0,.6);margin-bottom:6px;}
  .main-header .subtitle{font-size:1em;opacity:.9;}
  .back-link{display:inline-flex;align-items:center;gap:6px;margin:16px 18px;font-size:.85em;color:var(--dark-red);text-decoration:none;font-weight:bold;}
  .back-link:hover{color:var(--orange);}
  .section-bar{font-size:1.1em;font-weight:bold;padding:14px 22px;background:linear-gradient(90deg,var(--red),var(--orange));color:var(--white);border-radius:12px 12px 0 0;display:flex;align-items:center;gap:10px;margin:0 auto;max-width:1100px;}
  .session-list{max-width:1100px;margin:0 auto;background:var(--white);border:2px solid var(--orange);border-top:none;border-radius:0 0 12px 12px;margin-bottom:28px;}
  .session-card{display:block;padding:18px 24px;border-bottom:1px solid #FFE4B5;text-decoration:none;color:inherit;transition:background .2s;}
  .session-card:hover{background:#FFF3E0;}
  .session-card:last-child{border-bottom:none;}
  .card-date{font-size:.8em;color:#7a4a00;margin-bottom:3px;}
  .card-title{font-size:1.05em;font-weight:bold;color:var(--dark-red);line-height:1.4;}
  .card-arrow{float:right;color:var(--orange);font-size:1.2em;}
  footer{background:var(--dark-red);color:var(--white);text-align:center;padding:20px;border-top:6px solid var(--yellow);margin-top:10px;}
  footer p{color:var(--yellow);font-size:.9em;margin:4px 0;}

सुबोधिनी_गुजराती", "g": "अन्य सत्र", "k": null, "r": "गुजराती"}, {"h": "2026-06-18_-.html", "d": "2026-06-20", "t": "સુબોધિની_ગુજરાતી_૩/૨૫/૧૭૯-૧૯૨", "g": "स्कन्ध ३ · अध्याय २५", "k": 3025, "r": "श्लोक १७९-१९२"}, {"h": "session.html", "d": "", "t": "सुबोधिनी_गुजराती_२५/०१/१-०५", "g": "स्कन्ध २५ · अध्याय १", "k": 25001, "r": "श्लोक १-०५"}, {"h": "---.html", "d": "", "t": "सुबोधिनी_गुजराती_૩/૨૫/૩૮-૪૪", "g": "स्कन्ध ३ · अध्याय २५", "k": 3025, "r": "श्लोक ३८-४४"}];
  var list = document.getElementById('slx-list');
  var countEl = document.getElementById('slx-count');
  var chipWrap = document.getElementById('slx-chips');
  var input = document.getElementById('slx-q');
  var clear = document.getElementById('slx-clear');
  var order = 'granth';

  function groups(items){
    var by = {}, seq = [];
    items.forEach(function(it){
      if(!by[it.g]){ by[it.g] = {name: it.g, key: it.k, rows: []}; seq.push(by[it.g]); }
      by[it.g].rows.push(it);
    });
    return seq;
  }

  function render(){
    var q = input.value.trim().toLowerCase();
    var items = DATA.filter(function(it){
      return !q || (it.t + ' ' + it.d + ' ' + it.g).toLowerCase().indexOf(q) !== -1;
    });
    countEl.textContent = items.length + ' / ' + DATA.length + ' सत्र';
    clear.className = 'slx-clear' + (q ? ' on' : '');
    list.innerHTML = '';

    if(!items.length){
      list.innerHTML = '<div class="slx-empty">कोई सत्र नहीं मिला</div>';
      return;
    }

    if(order === 'date'){
      items = items.slice().sort(function(a,b){ return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });
      items.forEach(function(it){ list.appendChild(row(it, true)); });
      return;
    }

    var seq = groups(items.slice().sort(function(a,b){
      if(a.k !== b.k) return (a.k === null) - (b.k === null) || a.k - b.k;
      return a.d < b.d ? -1 : 1;
    }));
    seq.forEach(function(g){
      var box = document.createElement('div');
      box.className = 'slx-group';
      var h = document.createElement('div');
      h.className = 'slx-ghead';
      h.id = 'g' + (g.key === null ? 'x' : g.key);
      h.innerHTML = '<span>' + g.name + '</span><span class="n">' + g.rows.length + ' सत्र</span>';
      box.appendChild(h);
      g.rows.forEach(function(it){ box.appendChild(row(it, false)); });
      list.appendChild(box);
    });
  }

  function row(it, showGroup){
    var a = document.createElement('a');
    a.className = 'slx-item';
    a.href = it.h;
    a.innerHTML = '<span class="slx-ref">' + (showGroup ? it.g + ' · ' : '') + it.r +
                  '</span><span class="slx-date">' + it.d + '</span>';
    return a;
  }

  input.addEventListener('input', render);
  clear.addEventListener('click', function(){ input.value = ''; input.focus(); render(); });
  chipWrap.addEventListener('click', function(e){
    var b = e.target.closest('.slx-chip'); if(!b) return;
    if(order !== 'granth'){ order = 'granth'; syncSort(); render(); }
    var el = document.getElementById('g' + b.dataset.k);
    if(!el) return;
    // Not scrollIntoView: that puts the heading flush with the top of the window,
    // where the sticky search bar covers it.
    // The heading's own CSS 'top' is exactly where it comes to rest when stuck —
    // just below the toolbar — so landing it there needs no guessed padding.
    // A fixed guess was one group out on sections whose header is a different height.
    // stickyTop() is where this heading comes to rest, just under the toolbar,
    // so landing it there needs no guessed padding.
    var pad = stickyTop();
    // offsetTop, not getBoundingClientRect: the headings are sticky, so once one is
    // stuck its viewport rect reports the stuck position rather than where it lives.
    var y = 0, n = el;
    while(n){ y += n.offsetTop; n = n.offsetParent; }
    window.scrollTo(0, Math.max(0, y - pad));
  });
  // The toolbar wraps onto two rows of jump chips on a phone, so its height is not
  // something CSS can hard-code: measure it and let the group headings stick below it.
  // With a fixed value the headings parked behind the toolbar and every jump chip
  // appeared to land one group early.
  function stickyTop(){
    var tools = document.querySelector('.slx-tools');
    if(!tools) return 116;
    var own = parseFloat(getComputedStyle(tools).top);
    return (isFinite(own) ? own : 0) + tools.offsetHeight;
  }
  function syncStickyTop(){
    document.documentElement.style.setProperty('--slx-ghead-top', stickyTop() + 'px');
  }
  window.addEventListener('resize', syncStickyTop);

  function syncSort(){
    document.querySelectorAll('.slx-sort button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.o === order));
    });
    chipWrap.style.display = order === 'granth' ? '' : 'none';
  }
  document.querySelectorAll('.slx-sort button').forEach(function(b){
    b.addEventListener('click', function(){ order = b.dataset.o; syncSort(); render(); });
  });
  syncSort(); render(); syncStickyTop();
})();
